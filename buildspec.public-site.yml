version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REPOSITORY_URI"
      - IMAGE_TAG="${IMAGE_TAG:-latest}"
  build:
    commands:
      - echo Building image "$REPOSITORY_URI:$IMAGE_TAG"
      - docker build -t "$REPOSITORY_URI:$IMAGE_TAG" .
      - docker tag "$REPOSITORY_URI:$IMAGE_TAG" "$REPOSITORY_URI:latest"
  post_build:
    commands:
      - echo Pushing image "$REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$REPOSITORY_URI:$IMAGE_TAG"
      - echo Pushing image "$REPOSITORY_URI:latest"
      - docker push "$REPOSITORY_URI:latest"
      - echo Triggering ECS deployment
      - aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment --region "$AWS_DEFAULT_REGION"
