name: Validate Work Item Reference

on:
  pull_request:
    branches:
      - develop
      - release
      - UAT
      - Deployment
  push:
    branches:
      - '**'

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate-work-item:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit references
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          base_sha = os.environ.get('BASE_SHA', '').strip()
          head_sha = os.environ.get('HEAD_SHA', '').strip()
          default_branch = os.environ.get('DEFAULT_BRANCH', 'develop').strip() or 'develop'
          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']

          if not head_sha:
            print('HEAD_SHA is missing')
            sys.exit(1)

          revision_range = head_sha
          zero_sha = '0' * 40
          if base_sha and base_sha != zero_sha:
            revision_range = f'{base_sha}..{head_sha}'
          else:
            merge_base = subprocess.check_output(
              ['git', 'merge-base', head_sha, f'origin/{default_branch}'],
              text=True,
            ).strip()
            if merge_base and merge_base != head_sha:
              revision_range = f'{merge_base}..{head_sha}'

          log_output = subprocess.check_output(
            ['git', 'log', '--format=%H%x09%s', revision_range],
            text=True,
          ).strip()

          commits = []
          if log_output:
            for line in log_output.splitlines():
              sha, subject = line.split('\t', 1)
              commits.append((sha, subject.strip()))

          if not commits:
            single_subject = subprocess.check_output(
              ['git', 'log', '-1', '--format=%s', head_sha],
              text=True,
            ).strip()
            commits.append((head_sha, single_subject))

          pattern = re.compile(r'(?<!\w)(?:#|GH-)(\d+)\b')
          failures = []
          validated_issue_ids = set()

          def issue_exists(issue_id: str) -> bool:
            url = f'https://api.github.com/repos/{repository}/issues/{issue_id}'
            request = urllib.request.Request(
              url,
              headers={
                'Authorization': f'Bearer {token}',
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
            )
            try:
              with urllib.request.urlopen(request) as response:
                return response.status == 200
            except urllib.error.HTTPError:
              return False

          for sha, subject in commits:
            issue_ids = pattern.findall(subject)
            if not issue_ids:
              failures.append(f'{sha[:7]} missing work item reference: {subject}')
              continue

            missing = []
            for issue_id in sorted(set(issue_ids)):
              if issue_id in validated_issue_ids:
                continue
              if issue_exists(issue_id):
                validated_issue_ids.add(issue_id)
              else:
                missing.append(issue_id)

            if missing:
              failures.append(
                f"{sha[:7]} references unknown work item(s) {', '.join('#' + item for item in missing)}: {subject}"
              )

          if failures:
            print('Each commit must reference an existing GitHub issue, for example:')
            print('  feat: update hero banner GH-123')
            print('  fix: correct menu link #123')
            print('')
            print('\n'.join(failures))
            sys.exit(1)

          print(f'Validated {len(commits)} commit(s) with existing work item references.')
          PY
