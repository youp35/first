name: Branch Promotion

on:
  push:
    branches:
      - develop
      - UAT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-promotion-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch all remote branches
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Sync release from develop
        if: github.ref_name == 'develop'
        run: |
          git checkout -B release origin/develop
          git push origin release --force-with-lease

      - name: Sync UAT from release
        if: github.ref_name == 'develop'
        run: |
          git checkout -B UAT origin/release
          git push origin UAT --force-with-lease

      - name: Sync Deployment from UAT
        if: github.ref_name == 'UAT'
        run: |
          git checkout -B Deployment origin/UAT
          git push origin Deployment --force-with-lease
